# Testcontainers' bundled docker-java hardcodes API version 1.32 instead of negotiating.
# Docker Engine 29 raised the minimum accepted version to 1.44 on most installs (this
# project's Colima floors at 1.40); pinned above both. Workaround, not a root-cause fix:
# upgrading Testcontainers to 2.x would negotiate the version properly instead.
api.version=1.45
