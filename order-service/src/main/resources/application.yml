server:
  port: 8084

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

payment:
  # Simulated decline threshold (no real payment gateway), deterministic so the
  # failure path is actually testable.
  decline-above-amount: ${PAYMENT_DECLINE_ABOVE_AMOUNT:1000.00}

# Feign per-client timeouts. Resilience4j's TimeLimiter needs async returns, doesn't fit
# blocking Feign calls, so the per-attempt time bound lives here instead.
feign:
  client:
    config:
      cart-service:
        connect-timeout: 2000
        read-timeout: 3000
      product-service:
        connect-timeout: 2000
        read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:
      cart-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      product-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      # getCart (read-only) and clearCart (idempotent): safe to retry unconditionally.
      cart-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      # decrementStock/restock are mutations: only retry failures that plausibly never
      # reached product-service. 4xx means it already ran and rejected the request on its
      # merits (e.g. 409 insufficient stock), so it's excluded.
      product-service:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
          - feign.FeignException$UnprocessableEntity

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
