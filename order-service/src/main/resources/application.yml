server:
  port: 8084

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

payment:
  # Simulated decline threshold (no real payment gateway) - deterministic so the
  # failure path is actually testable.
  decline-above-amount: ${PAYMENT_DECLINE_ABOVE_AMOUNT:1000.00}

management:
  endpoints:
    web:
      exposure:
        include: health,info
