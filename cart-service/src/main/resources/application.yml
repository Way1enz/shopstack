server:
  port: 8083

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: cart-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    loadbalancer:
      # Same reasoning as api-gateway's application.yml: default 35s, stacks on top of
      # eureka.client.registry-fetch-interval-seconds below.
      cache:
        ttl: 5s

cart:
  ttl-hours: ${CART_TTL_HOURS:72}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    # Default is 30s; see api-gateway's application.yml for why this is tuned down here too.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
