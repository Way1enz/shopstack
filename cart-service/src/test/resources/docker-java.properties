# The Testcontainers version pulled in transitively via Spring Boot 3.3.4's BOM bundles an
# old docker-java that hardcodes API version 1.32 instead of negotiating with the daemon.
# Docker 29+ (including recent Colima) rejects anything below 1.40. This pins the client to
# a version comfortably inside the daemon's accepted range as a workaround.
#
# This is a workaround, not a root-cause fix - a real fix would upgrade Testcontainers to
# 2.x, which negotiates the API version properly instead of hardcoding one. That's a
# version bump worth its own dedicated testing (same reasoning as not rushing the Spring
# Boot bump earlier), so it's deferred rather than done here as a quick patch.
api.version=1.41
