server:
  port: 8761

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # The registry itself does not need to register with / fetch from itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Self-preservation guards against mass false-eviction during a peer network partition.
    # Standalone single-node server, no peers to partition from; left on, it can mask
    # genuinely dead instances after container churn (e.g. scaling a service down).
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
