# Full local deployment of the e-commerce platform:
#   postgres (3 logical DBs) + redis  ->  eureka-server  ->  api-gateway
#                                                          -> user-service
#                                                          -> product-service
#                                                          -> cart-service
#                                                          -> order-service
#
# Start everything:   docker compose up --build
# Stop everything:    docker compose down
# Stop + wipe data:   docker compose down -v

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      # Explicitly target the "postgres" database (created via POSTGRES_DB
      # above). Without "-d", pg_isready defaults to probing a database
      # named after the user ("ecommerce"), which doesn't exist - Postgres
      # logs that as FATAL even though pg_isready itself still reports the
      # server healthy. Pointing at a real database avoids the noisy log.
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-net

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-net

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-min-32-chars-long}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecommerce-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecommerce-net

  cart-service:
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_DECLINE_ABOVE_AMOUNT: ${PAYMENT_DECLINE_ABOVE_AMOUNT:-1000.00}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecommerce-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - ecommerce-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-super-secret-key-min-32-chars-long}
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
