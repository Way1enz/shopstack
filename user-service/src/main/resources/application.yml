server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) - Hibernate just confirms its
      # entity mappings actually match the real schema at startup, failing fast with a clear
      # error if they drift, rather than silently auto-modifying anything.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    # baseline-on-migrate: this database already has tables (created by ddl-auto: update,
    # before Flyway existed in this project). Without this, Flyway refuses to run against a
    # non-empty schema it doesn't recognize. baseline-version: 1 tells it "treat V1 as already
    # applied" for that existing data, WITHOUT re-running V1's CREATE TABLE statements against
    # tables that already exist. A genuinely fresh database (e.g. after docker compose down -v)
    # has no pre-existing schema to baseline, so Flyway just runs V1 normally there instead.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}
  # Access tokens are intentionally short-lived (15 min default) since
  # they're stateless and can't be revoked - if one leaks, it's only
  # useful for a short window. Long-lived sessions are handled by the
  # separate, revocable refresh token below instead.
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  # Refresh tokens are opaque DB-backed strings (see RefreshToken entity),
  # default 7 days, and are rotated (replaced) on every use.
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
