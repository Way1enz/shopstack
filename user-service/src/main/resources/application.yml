server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
  jpa:
    hibernate:
      # Flyway owns schema changes (see db/migration/) - Hibernate just validates its
      # entity mappings match the real schema at startup, failing fast on drift.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    # baseline-on-migrate: this database had tables before Flyway existed (from ddl-auto:
    # update). baseline-version: 1 treats V1 as already applied for that existing data,
    # without re-running its CREATE TABLE statements. A fresh database just runs V1 normally.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}
  # Access tokens are short-lived (15 min) since they're stateless and can't be revoked.
  # Long-lived sessions are handled by the separate, revocable refresh token below.
  expiration-ms: ${JWT_EXPIRATION_MS:900000}
  # Refresh tokens are opaque DB-backed strings (see RefreshToken entity),
  # default 7 days, and are rotated (replaced) on every use.
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
