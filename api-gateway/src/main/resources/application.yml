server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # ---- Auth (register/login) - public ----
            - id: auth-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**

            # ---- User profile - requires a valid JWT ----
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - AuthFilter

            # ---- Product catalog: browsing is public ----
            - id: product-service-read
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
                - Method=GET

            # ---- Product catalog: mutations require a valid JWT ----
            - id: product-service-write
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
                - Method=POST,PUT,DELETE
              filters:
                - AuthFilter

            # ---- Cart - always requires a valid JWT ----
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart/**
              filters:
                - AuthFilter

            # ---- Orders - always requires a valid JWT ----
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - AuthFilter

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
