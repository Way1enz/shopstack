server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ---- Auth (register/login) - public ----
        - id: auth-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**

        # ---- User profile - requires a valid JWT ----
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - AuthFilter

        # ---- Product catalog: browsing is public ----
        - id: product-service-read
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
            - Method=GET

        # ---- Product catalog: mutations require a valid JWT ----
        - id: product-service-write
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**
            - Method=POST,PUT,DELETE
          filters:
            - AuthFilter

        # ---- Cart - always requires a valid JWT ----
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/api/cart/**
          filters:
            - AuthFilter

        # ---- Orders - always requires a valid JWT ----
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            - AuthFilter

        # ---- OpenAPI docs - public, no AuthFilter. Each service's raw spec, proxied
        # through the gateway so the aggregated Swagger UI below can fetch them without
        # a CORS issue (same-origin through :8080) and without exposing each service's
        # internal port to the host. ----
        - id: user-service-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service/v3/api-docs, /v3/api-docs

        - id: product-service-docs
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product-service/v3/api-docs
          filters:
            - RewritePath=/product-service/v3/api-docs, /v3/api-docs

        - id: cart-service-docs
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart-service/v3/api-docs
          filters:
            - RewritePath=/cart-service/v3/api-docs, /v3/api-docs

        - id: order-service-docs
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}

# One Swagger UI at the gateway (http://localhost:8080/swagger-ui.html) aggregating all
# four services via a dropdown, instead of four separate UIs on ports the host can't
# even reach. Each URL below resolves through the docs routes just above.
springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Cart Service
        url: /cart-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
