server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    loadbalancer:
      # Default is 35s and stacks on top of eureka.client.registry-fetch-interval-seconds
      # above, so the two together were masking newly scaled instances for up to ~65s.
      cache:
        ttl: 5s
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # ---- Auth (register/login): public, IP-keyed (brute-force target) ----
            - id: auth-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- User profile: requires a valid JWT ----
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Product catalog: browsing is public, IP-keyed ----
            - id: product-service-read
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Product catalog: mutations require a valid JWT ----
            - id: product-service-write
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
                - Method=POST,PUT,DELETE
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Cart: always requires a valid JWT ----
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart/**
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Orders: always requires a valid JWT. Lower burst than default.
            # Checkout fans out into cart-service plus N product-service calls downstream. ----
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- OpenAPI docs: public, no AuthFilter. Proxied so the aggregated Swagger UI
            # below can fetch them same-origin, without exposing each service's port to the host. ----
            - id: user-service-docs
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs

            - id: product-service-docs
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/v3/api-docs, /v3/api-docs

            - id: cart-service-docs
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart-service/v3/api-docs
              filters:
                - RewritePath=/cart-service/v3/api-docs, /v3/api-docs

            - id: order-service-docs
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    # Default is 30s. At this scale, a 30s-stale view of the registry means a
    # freshly scaled or crashed instance takes too long to be reflected here.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}

# One Swagger UI at the gateway (http://localhost:8080/swagger-ui.html) aggregating all
# four services via a dropdown, instead of four separate UIs on ports the host can't
# even reach. Each URL below resolves through the docs routes just above.
springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Product Service
        url: /product-service/v3/api-docs
      - name: Cart Service
        url: /cart-service/v3/api-docs
      - name: Order Service
        url: /order-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
  tracing:
    sampling:
      # 1.0 traces every request, useful for a local/portfolio demo. Lower it
      # (e.g. 0.1) in production.
      probability: 1.0
    export:
      zipkin:
        endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
