server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # ---- Auth (register/login) - public, IP-keyed (brute-force target) ----
            - id: auth-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- User profile - requires a valid JWT ----
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Product catalog: browsing is public - IP-keyed ----
            - id: product-service-read
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Product catalog: mutations require a valid JWT ----
            - id: product-service-write
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/products/**
                - Method=POST,PUT,DELETE
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Cart - always requires a valid JWT ----
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/api/cart/**
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

            # ---- Orders - always requires a valid JWT. Lower burst - checkout fans out
            # into cart-service + N product-service calls downstream. ----
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
              filters:
                - AuthFilter
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@rateLimiterKeyResolver}"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
